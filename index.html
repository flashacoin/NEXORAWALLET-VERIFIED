<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#080D18;--bg2:#111827;--card:#172235;--green:#00E89D;--blue:#318BFF;--purple:#925CFF;--white:#F8FAFC;--muted:#94A3B8;--red:#FF5263}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(49,139,255,.12),transparent 40%),radial-gradient(circle at 80% 90%,rgba(146,92,255,.10),transparent 40%);pointer-events:none;z-index:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:1;padding-bottom:90px}
.screen{display:none;animation:fadeIn .35s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass{background:rgba(23,34,53,.75);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:18px}
.neon{border:1px solid rgba(0,232,157,.35);box-shadow:0 0 18px rgba(0,232,157,.12)}
.grad-btn{background:linear-gradient(135deg,var(--green),var(--blue));color:#04101c;font-weight:700;border:none;border-radius:14px;padding:14px 20px;width:100%;font-size:15px;cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(0,232,157,.25)}
.grad-btn:active{transform:scale(.97)}
.ghost-btn{background:rgba(255,255,255,.06);color:var(--white);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:13px 18px;width:100%;font-size:15px;cursor:pointer}
.danger-btn{background:linear-gradient(135deg,var(--red),#ff8a5c);color:#fff;font-weight:700;border:none;border-radius:14px;padding:13px;width:100%;cursor:pointer}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--white);border-radius:12px;padding:13px 14px;font-size:15px;outline:none;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,232,157,.15)}
select option{background:var(--bg2)}
label{font-size:12px;color:var(--muted);display:block;margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.5px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;position:sticky;top:0;background:rgba(8,13,24,.85);backdrop-filter:blur(12px);z-index:10;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s infinite}
@keyframes shimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.bell{position:relative;font-size:20px;cursor:pointer;background:none;border:none;color:var(--white)}
.badge{position:absolute;top:-5px;right:-7px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center}
.card{padding:16px;margin:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:17px;font-weight:800;color:var(--green)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.coin-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:.15s}
.coin-row:active{transform:scale(.98)}
.coin-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04101c;flex-shrink:0}
.tab-bar{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;border:1px solid transparent}
.tab.on{background:rgba(0,232,157,.15);color:var(--green);border-color:rgba(0,232,157,.4)}
.pkg{background:linear-gradient(160deg,var(--card),#0f1a2b);border:1px solid rgba(49,139,255,.25);border-radius:16px;padding:16px;margin:12px 14px;position:relative;overflow:hidden}
.pkg::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--blue),var(--purple))}
.pkg h3{font-size:15px;letter-spacing:1px;text-transform:uppercase}
.pkg .amt{font-size:26px;font-weight:800;color:var(--green);margin:6px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.g{background:rgba(0,232,157,.15);color:var(--green)}
.pill.b{background:rgba(49,139,255,.15);color:var(--blue)}
.pill.p{background:rgba(146,92,255,.18);color:#b79bff}
.pill.r{background:rgba(255,82,99,.15);color:var(--red)}
.notif{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.notif.unread{border-left:3px solid var(--green)}
.notif .t{font-size:11px;color:var(--muted)}
.chat-b{display:flex;margin:8px 0;max-width:82%}
.chat-b.me{margin-left:auto}
.chat-b .bub{background:var(--card);padding:10px 14px;border-radius:14px;font-size:14px}
.chat-b.me .bub{background:linear-gradient(135deg,rgba(0,232,157,.25),rgba(49,139,255,.25));border:1px solid rgba(0,232,157,.3)}
.wallet-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.wallet-opt .wic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(49,139,255,.15)}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--blue));width:0;transition:width 1s ease}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(0,232,157,.5)}70%{box-shadow:0 0 0 9px rgba(0,232,157,0)}100%{box-shadow:0 0 0 0 rgba(0,232,157,0)}}
.center{text-align:center;padding:60px 20px}
.big{font-size:44px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hide{display:none!important}
.marq{overflow:hidden;white-space:nowrap;background:rgba(0,232,157,.08);border-radius:10px;padding:8px 0;margin:10px 14px}
.marq span{display:inline-block;animation:mq 18s linear infinite;font-size:13px;color:var(--green)}
@keyframes mq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.hero{background:linear-gradient(135deg,rgba(0,232,157,.14),rgba(49,139,255,.14));border:1px solid rgba(0,232,157,.25);border-radius:20px;padding:22px 18px;margin:14px}
.hero h2{font-size:22px;margin-bottom:6px}
.bal-big{font-size:34px;font-weight:800;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.menu-item:active{transform:scale(.98)}
.menu-item .mi{font-size:20px}
.qa{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.qa .a{display:none;padding-top:8px;color:var(--muted);font-size:13px}
.qa.open .a{display:block}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(0,232,157,.4);color:var(--white);padding:10px 18px;border-radius:12px;font-size:13px;z-index:99;animation:fadeIn .3s}
.skel{border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:sk 1.4s infinite;height:70px;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
.vip{background:linear-gradient(135deg,rgba(146,92,255,.25),rgba(49,139,255,.2));border:1px solid rgba(146,92,255,.4)}

function tickOrders(){if(!DB.orders)return;var t=now();for(var i=0;i<DB.orders.length;i++){var o=DB.orders[i];var du=Number(o.dur)||30;if(o.status==="processing"){var el=(t-(o.t0||t))/1000;o.prog=Math.min(100,Math.floor(el*100/du));if(el>=du){o.status="delivered";o.prog=100;for(var k in DB.users){var x=DB.users[k];if(x&&x.id===o.u){x.locked=Math.max(0,Number(x.locked)-Number(o.dep||0));x.bal=Number(x.bal)+Number(o.amt);x.points=Number(x.points)+5;addNotif(o.u,"Order delivered","Your "+o.coin+" package is complete. Target credited.","order");postHook("order",{side:o.side,coin:o.coin,amount:o.amt,status:"delivered"})}}}}else if(o.status==="pending"&&(t-o.time)/1000>30){o.status="processing";o.t0=t;addNotif(o.u,"Order processing","Your order is now being processed.","order")}}save("db",DB)}
function creditRefs(){if(!DB.orders)return;for(var i=0;i<DB.orders.length;i++){var o=DB.orders[i];if(o.status==="delivered"&&!o.refDone){o.refDone=true;for(var k in DB.users){var x=DB.users[k];if(x&&x.id===o.u&&x.ref&&DB.users[x.ref]){var rf=DB.users[x.ref];rf.refEarn=Number(rf.refEarn||0)+Number(o.amt)*0.1;rf.refs=Number(rf.refs||0)+1;rf.points=Number(rf.points||0)+10;addNotif(rf.id,"Referral reward",x.name+" completed a package. You earned 10% in points.","referral")}}}}save("db",DB)}
