<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — Reset Password</title>
<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:18px}.box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.brand{font-weight:850;letter-spacing:2px;font-size:21px}.brand span{color:var(--gold)}h1{font-size:22px;margin:25px 0 8px}p{color:var(--muted);line-height:1.55}input,button{display:block;width:100%;padding:12px;margin-top:12px;border-radius:10px;font:inherit}input{border:1px solid var(--line);background:#090d13;color:var(--text)}button{border:1px solid #4d4227;background:#211c13;color:var(--gold);cursor:pointer;font-weight:650}#notice{font-size:13px;min-height:24px}
</style></head><body><main class="box"><div class="brand">NEXORA<span>.</span></div><h1>Set a new password</h1><p>Enter and confirm your new account password below.</p><input id="password" type="password" autocomplete="new-password" placeholder="New password (at least 8 characters)"><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="save">Update password</button><p id="notice">Open this page from your Supabase password-reset email.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const client=window.supabase.createClient("https://enfmybsgkhonjprlgusk.supabase.co","sb_publishable_myD1MDYUobf3w-nph3hbow_5tIsnJk3");const notice=document.getElementById("notice");const button=document.getElementById("save");button.addEventListener("click",async()=>{const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p.length<8){notice.textContent="Password must be at least 8 characters.";return;}if(p!==c){notice.textContent="Passwords do not match.";return;}button.disabled=true;notice.textContent="Updating password…";const {data,error}=await client.auth.updateUser({password:p});button.disabled=false;if(error){notice.textContent=error.message;return;}notice.textContent="Password updated. You may now return to the wallet and sign in.";document.getElementById("password").value="";document.getElementById("confirm").value="";});})();
