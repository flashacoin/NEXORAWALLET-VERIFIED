name: Deploy NEXORA V2 to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - nexora-v2-deposit-dev
    paths:
      - "v2/**"
      - ".github/workflows/deploy-nexora-v2-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexora-v2-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
      - name: Prepare static V2 site
        run: |
          mkdir -p _site
          cp -R v2/. _site/
          touch _site/.nojekyll
          test -s _site/index.html
          echo "Prepared V2 Pages artifact."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
