name: NEXORA V2 Edge Function Checks

on:
  push:
    branches: [nexora-v2]
    paths:
      - "v2/**"
      - ".github/workflows/nexora-v2-check.yml"
  pull_request:
    branches: [nexora-v2]
    paths:
      - "v2/**"
      - ".github/workflows/nexora-v2-check.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check wallet and transaction functions
        run: |
          deno check v2/supabase/functions/nexora-wallet/index.ts
          deno check v2/supabase/functions/nexora-admin/index.ts
          deno check v2/supabase/functions/nexora-deposit-submit/index.ts
          deno check v2/supabase/functions/nexora-withdrawal-submit/index.ts
          deno check v2/supabase/functions/nexora-deposit-verify-preview/index.ts
      - name: Parse SQL migrations for syntax errors
        run: |
          python3 -m pip install --quiet pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          migrations = sorted(Path("v2/supabase/migrations").glob("*.sql"))
          if not migrations:
              raise SystemExit("No SQL migrations found")
          for path in migrations:
              parse_sql(path.read_text())
              print(f"SQL syntax OK: {path}")
          PY
      - name: Assert critical wallet safety guards remain present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "v2/supabase/migrations/006_admin_withdrawal_review.sql": [
                  "for update",
                  "withdrawal-refund:",
                  "ledger_refund_id is null",
                  "v_w.status <> 'processing'",
                  "transaction hash already used",
                  "auth.role(),'') <> 'service_role'",
              ],
              "v2/supabase/functions/nexora-admin/index.ts": [
                  "Bearer ",
                  "NEXORA_ADMIN_USER_IDS",
                  "Administrator access required",
                  "withdrawal_complete",
                  "Invalid TRON transaction hash",
              ],
              "v2/supabase/functions/nexora-deposit-submit/index.ts": [
                  "tx_hash",
                  "p_tx_hash",
                  "not been credited",
              ],
          }
          for filename, needles in checks.items():
              text = Path(filename).read_text().lower()
              for needle in needles:
                  if needle.lower() not in text:
                      raise SystemExit(f"Missing safety guard: {filename}: {needle}")
              print(f"Safety assertions OK: {filename}")
          PY
      - name: Assert CSV formula protection exists in both exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ['v2/admin-deposits.html', 'v2/admin-withdrawals.html']:
              source = Path(filename).read_text()
              if r'\\x1f' not in source or 'test(s)' not in source:
                  raise SystemExit(f'CSV formula protection missing: {filename}')
              print(f'CSV formula protection OK: {filename}')
          PY
      - name: Syntax-check inline JavaScript in wallet/admin HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for html in [Path("v2/index.html"), Path("v2/admin.html"), Path("v2/admin-deposits.html"), Path("v2/admin-withdrawals.html")]:
              content = html.read_text()
              blocks = re.findall(r"<script(?![^>]*src=)[^>]*>(.*?)</script>", content, flags=re.S|re.I)
              for i, block in enumerate(blocks):
                  out = Path("/tmp") / f"{html.stem}-inline-{i}.js"
                  out.write_text(block)
                  print(f"Checking {out}")
          PY
          for js in /tmp/*-inline-*.js; do [ -f "$js" ] && node --check "$js"; done
