name: NEXORA V2 Edge Function Checks

on:
  push:
    branches: [nexora-v2, nexora-v2-deposit-dev]
    paths:
      - "v2/**"
      - ".github/workflows/nexora-v2-check.yml"
  pull_request:
    branches: [nexora-v2]
    paths:
      - "v2/**"
      - ".github/workflows/nexora-v2-check.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check wallet and transaction functions
        run: |
          deno check v2/supabase/functions/nexora-wallet/index.ts
          deno check v2/supabase/functions/nexora-admin/index.ts
          deno check v2/supabase/functions/nexora-deposit-submit/index.ts
          deno check v2/supabase/functions/nexora-withdrawal-submit/index.ts
          deno check v2/supabase/functions/nexora-admin/nexora-withdrawal-verifier.ts
          deno test v2/supabase/functions/nexora-admin/nexora-withdrawal-verifier_test.ts
          deno check v2/supabase/functions/nexora-deposit-settle/index.ts
          deno check v2/supabase/functions/nexora-deposit-verify-preview/index.ts
          deno check v2/supabase/functions/nexora-deposit-verify-preview/tron-usdt-transfer.ts
          deno test v2/supabase/functions/nexora-deposit-verify-preview/tron-usdt-transfer_test.ts
      - name: Parse SQL migrations for syntax errors
        run: |
          python3 -m pip install --quiet pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          migrations = sorted(Path("v2/supabase/migrations").glob("*.sql"))
          diagnostics = sorted(Path("v2/supabase/diagnostics").glob("*.sql"))
          sql_files = migrations + diagnostics
          if not migrations:
              raise SystemExit("No SQL migrations found")
          for path in sql_files:
              parse_sql(path.read_text())
              print(f"SQL syntax OK: {path}")
          PY
      - name: Assert critical wallet safety guards remain present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "v2/supabase/migrations/010_withdrawal_idempotency_concurrency.sql": [
                  "pg_advisory_xact_lock",
                  "hashtextextended",
                  "idempotency_key",
              ],
              "v2/supabase/migrations/006_admin_withdrawal_review.sql": [
                  "for update",
                  "withdrawal-refund:",
                  "ledger_refund_id is null",
                  "v_w.status <> 'processing'",
                  "transaction hash already used",
                  "auth.role(),'') <> 'service_role'",
              ],
              "v2/supabase/migrations/015_withdrawal_chain_verification.sql": [
                  "verified on-chain withdrawal evidence required",
                  "nx_withdrawal_verification_evidence",
                  "unique(network_code, tx_hash, event_index)",
                  "before update or delete",
              ],
              "v2/supabase/functions/nexora-admin/index.ts": [
                  "Bearer ",
                  "NEXORA_ADMIN_USER_IDS",
                  "Administrator access required",
                  "withdrawal_complete",
                  "verifyWithdrawalTransfer",
                  "nx_record_withdrawal_evidence",
                  "NEXORA_WITHDRAWAL_CONFIRMATIONS",
                  "Invalid TRON transaction hash",
              ],
              "v2/supabase/functions/nexora-deposit-submit/index.ts": [
                  "tx_hash",
                  "p_tx_hash",
                  "not been credited",
              ],
          }
          for filename, needles in checks.items():
              text = Path(filename).read_text().lower()
              for needle in needles:
                  if needle.lower() not in text:
                      raise SystemExit(f"Missing safety guard: {filename}: {needle}")
              print(f"Safety assertions OK: {filename}")
          PY
      - name: Verify ledger wallet owner and asset foreign key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path("v2/supabase/migrations/012_ledger_wallet_owner_asset_integrity.sql").read_text().lower()
          required = [
              "create unique index if not exists wallets_id_user_asset_unique",
              "on public.wallets(id, user_id, asset_code)",
              "foreign key (wallet_id, user_id, asset_code)",
              "references public.wallets(id, user_id, asset_code)",
              "not valid",
              "validate constraint nx_wallet_ledger_wallet_owner_asset_fk",
          ]
          for item in required:
              if item not in sql:
                  raise SystemExit(f"Missing ledger integrity safeguard: {item}")
          print("Ledger wallet ownership and asset integrity guard OK")
          PY
      - name: Verify ledger balance row lock and atomic update ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path("v2/supabase/migrations/011_ledger_retry_before_balance_check.sql").read_text().lower()
          lock = sql.find("for update")
          retry = sql.find("select id into v_entry_id from public.nx_wallet_ledger")
          balance = sql.find("if v_balance + p_amount < 0")
          insert = sql.find("insert into public.nx_wallet_ledger")
          update = sql.find("update public.wallets")
          if min(lock, retry, balance, insert, update) < 0 or not lock < retry < balance < insert < update:
              raise SystemExit("Ledger must lock wallet, resolve retry, validate funds, insert ledger, then update balance")
          if "on conflict (idempotency_key) do nothing" not in sql:
              raise SystemExit("Ledger unique-key race fallback missing")
          print("Ledger balance locking and posting order OK")
          PY
      - name: Verify ledger idempotency is checked before balance rejection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path("v2/supabase/migrations/011_ledger_retry_before_balance_check.sql").read_text().lower()
          lookup = sql.find("select id into v_entry_id from public.nx_wallet_ledger")
          balance = sql.find("if v_balance + p_amount < 0")
          insert = sql.find("insert into public.nx_wallet_ledger")
          if min(lookup, balance, insert) < 0 or not lookup < balance < insert:
              raise SystemExit("Ledger idempotency lookup must precede balance validation and insert")
          for required in ("idempotency_key = p_idempotency_key", "idempotency key reused for a different operation", "return v_entry_id"):
              if required not in sql:
                  raise SystemExit(f"Missing ledger retry safeguard: {required}")
          print("Ledger idempotency retry ordering OK")
          PY
      - name: Verify withdrawal retry lock precedes idempotency lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path("v2/supabase/migrations/010_withdrawal_idempotency_concurrency.sql").read_text().lower()
          lock = sql.find("pg_advisory_xact_lock")
          lookup = sql.find("select * into v_existing")
          insert = sql.find("insert into public.nx_withdrawals")
          if min(lock, lookup, insert) < 0 or not lock < lookup < insert:
              raise SystemExit("Withdrawal idempotency lock must run before lookup and insert")
          if "hashtextextended(p_user_id::text || ':' || p_idempotency_key, 0)" not in sql:
              raise SystemExit("Withdrawal lock must be scoped to user and idempotency key")
          if "unique index if not exists nx_withdrawals_idempotency_unique" not in sql:
              raise SystemExit("Database unique idempotency safeguard missing")
          print("Withdrawal idempotency concurrency ordering OK")
          PY
      - name: Enforce deposit preview remains read-only
        run: |
          python3 v2/supabase/tests/deposit-preview-safety.py
          python3 v2/supabase/tests/deposit-settlement-safety.py
      - name: Assert CSV formula protection exists in both exports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ['v2/admin-deposits.html', 'v2/admin-withdrawals.html']:
              source = Path(filename).read_text()
              required = ['x00-', 'test(s)']
              if any(marker not in source for marker in required):
                  raise SystemExit(f'CSV formula protection missing: {filename}')
              if not ('s="\u0027"+s' in source or 's="\\u0027"+s' in source or 's="\u0027"+s' in source):
                  # Both implementations must prefix suspicious cells with a literal apostrophe.
                  raise SystemExit(f'CSV neutralization missing: {filename}')
              print(f'CSV formula protection OK: {filename}')
          PY
      - name: Syntax-check inline JavaScript in wallet/admin HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for html in [Path("v2/index.html"), Path("v2/admin.html"), Path("v2/admin-deposits.html"), Path("v2/admin-withdrawals.html")]:
              content = html.read_text()
              blocks = re.findall(r"<script(?![^>]*src=)[^>]*>(.*?)</script>", content, flags=re.S|re.I)
              for i, block in enumerate(blocks):
                  out = Path("/tmp") / f"{html.stem}-inline-{i}.js"
                  out.write_text(block)
                  print(f"Checking {out}")
          PY
          for js in /tmp/*-inline-*.js; do [ -f "$js" ] && node --check "$js"; done

  ledger-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nexora_ci_only
          POSTGRES_DB: nexora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run migration 012 against disposable PostgreSQL
        env:
          PGPASSWORD: nexora_ci_only
        run: |
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -f v2/supabase/tests/ledger-wallet-owner-asset.integration.sql
      - name: Run wallet payment and cancellation integration tests
        env:
          PGPASSWORD: nexora_ci_only
        run: |
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon;'
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated;'
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role;'
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -f v2/supabase/tests/wallet-order-payment.integration.sql
      - name: Run withdrawal lifecycle integration tests
        env:
          PGPASSWORD: nexora_ci_only
        run: |
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -f v2/supabase/tests/withdrawal-lifecycle.integration.sql
      - name: Run deposit submission safety integration tests
        env:
          PGPASSWORD: nexora_ci_only
        run: |
          psql -h localhost -U postgres -d nexora_ci -v ON_ERROR_STOP=1 -f v2/supabase/tests/deposit-submission.integration.sql
